name: test

on:
  push:
    branches: ["Top-Men"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tonmen_ci
          POSTGRES_PASSWORD: tonmen_ci_password
          POSTGRES_DB: tonmen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tonmen_ci -d tonmen_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TONMEN_TEST_POSTGRES_URL: postgresql://tonmen_ci:tonmen_ci_password@127.0.0.1:5432/tonmen_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: PostgreSQL knowledge integration
        run: python -m pytest -q tests/test_knowledge_postgres.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build responsive console
        working-directory: web
        run: npm run build

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build production image and verify pinned provider CLIs
        run: docker build --progress=plain -t tiangong-provider-auth-ci .
