[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tonmen"
version = "0.4.0a2"
description = "TONMEN — Autonomous Security Agent Runtime by Top-Men AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Top-Men AI"}]
keywords = ["security", "agent", "mcp", "automation"]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
tonmen = "tonmen.entry:main"

[project.optional-dependencies]
mcp = ["fastmcp>=0.2.0,<1.0.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tonmen.dashboard.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
